name: Release

# Publishing is started by hand, never by a push: run this workflow from the Actions tab once
# the version and changelog are ready. It needs the repository secret NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install qpdf (structural PDF checks)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack
        run: pnpm --filter mbingpdf pack --pack-destination "$RUNNER_TEMP"
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm --filter mbingpdf publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
