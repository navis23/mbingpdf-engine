name: Release

# Publishing is started by hand, never by a push: run this workflow from the Actions tab once
# the version and changelog are ready. It publishes through npm trusted publishing (OIDC): each
# package on npmjs.com trusts this repository's release.yml, so no token is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # No registry-url: with one, setup-node writes an .npmrc whose token is a placeholder,
          # and npm sends that instead of logging in through OIDC (the registry answers 404).
      - name: Install qpdf (structural PDF checks)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: npm 11.5.1 or later (trusted publishing needs it)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack
        run: pnpm --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP/packages"
      # pnpm pack has already turned workspace: ranges into real versions; npm publishes the
      # tarballs, logging in through OIDC. Versions already on npm are skipped, so a re-run
      # after a partial failure finishes the job.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: |
          for tarball in "$RUNNER_TEMP"/packages/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")
            version=$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            npm publish "$tarball" --access public
          done
      - name: Show npm's login attempt
        if: ${{ failure() && !inputs.dry-run }}
        run: grep -h -i -E "oidc|trusted|auth" ~/.npm/_logs/*-debug-*.log || true
